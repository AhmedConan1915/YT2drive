name: Video Transfer Worker

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID to process'
        required: true
  repository_dispatch:
    types: [new-job]

jobs:
  process-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo google-api-python-client google-auth-httplib2 google-auth-oauthlib yt-dlp requests

      - name: Run Worker Script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.GDRIVE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || secrets.GDRIVE_CLIENT_SECRET }}
          JOB_ID: ${{ github.event.inputs.jobId || github.event.client_payload.jobId }}
        run: python worker/worker.py
