name: Transfer Video to GDrive

on:
  repository_dispatch:
    types: [start-transfer]

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Install rclone
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = {"access_token":"${{ github.event.client_payload.access_token }}","token_type":"Bearer","expiry":"2099-01-01T00:00:00Z"}
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          EOF

      - name: Download and Upload
        run: |
          YT_URL="${{ github.event.client_payload.url }}"
          # Use ios client which is currently more resistant to bot checks
          # Add --no-colors for cleaner logs and more retries
          yt-dlp -f "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            --yes-playlist \
            --user-agent "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1" \
            --extractor-args "youtube:player-client=ios,web,android;player-skip=web_embedded_client" \
            --socket-timeout 30 \
            --retries 10 \
            "$YT_URL" -o "downloads/%(title)s.%(ext)s"
          FOLDER="${{ github.event.client_payload.folder || 'utube2drive' }}"
          rclone copy downloads/ "gdrive:$FOLDER/" --progress
